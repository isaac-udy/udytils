name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM, Android and wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      # jvmTest + test cover the JVM test source sets, and :ui-html:jsTest the Compose HTML tests in
      # headless Chrome; the extra compile tasks are cheap smoke checks for the other wasm and js
      # sources, and the Android app transitively compiles all androidMain.
      - name: Run tests
        run: ./gradlew jvmTest test :ui-html:jsTest compileKotlinWasmJs compileKotlinJs :samples:app:android:assembleDebug --continue

  apple:
    name: iOS targets
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Simulator tests exercise the ios source sets; the device-arch compile catches
      # iosArm64-only breakage the simulator build wouldn't.
      - name: Run simulator tests and device compile
        run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64 --continue
